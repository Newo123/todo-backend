services:
  web-server:
    image: caddy:2.11.1-alpine
    container_name: web-server
    environment:
      - CADDY_HOST=${CADDY_HOST:-localhost}
    volumes:
      - ${PROJECT_ROOT}/web/Caddyfile:/etc/caddy/Caddyfile
      - ${PROJECT_ROOT}/out/caddy_data:/data
      - ${PROJECT_ROOT}/web/public:/web/public
    ports:
      - "80:80"
      - "443:443"
    restart: always
  todoapp:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: ${PROJECT_ROOT}/cmd/todoapp/Dockerfile
    container_name: todoapp
    env_file:
      - ${PROJECT_ROOT}/.env
    environment:
      - HTTP_ADDR=:5050
      - POSTGRES_HOST=todo-postgres
      - REDIS_HOST=todo-redis
      - LOGGER_FOLDER=/app/out/logs
    volumes:
      - ${PROJECT_ROOT}/out/logs:/app/out/logs
    restart: always
  todo-postgres:
    container_name: todo-env-postgres
    image: postgres:18.4-bookworm
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql

  todo-redis:
    container_name: todo-env-redis
    image: redis:8.6.1
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    restart: always

  todo-postgres-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations

  port-forwarder:
    image: alpine/socat:1.8.0.3
    container_name: todo-env-port-forwarder
    entrypoint: |
      /bin/sh -c "
        socat -d -d tcp-listen:5432,fork,reuseaddr tcp-connect:todo-postgres:5432 &
        socat -d -d tcp-listen:6379,fork,reuseaddr tcp-connect:todo-redis:6379 &
        wait
      "
    ports:
      - "127.0.0.1:5432:5432"
      - "127.0.0.1:6379:6379"
  swagger:
    build:
      context: ${PROJECT_ROOT}
      dockerfile_inline: |
        FROM golang:1.26.6-alpine
        RUN apk add --no-cache git
        RUN go install github.com/swaggo/swag/cmd/swag@v1.16.6
        WORKDIR /code
        ENTRYPOINT ["swag"]
    volumes:
      - ${PROJECT_ROOT}:/code

volumes:
  postgres_data:
  redis_data:
